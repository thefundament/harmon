name: STT benchmark offline checks
on:
  push:
    paths:
      - '.github/workflows/model-benchmark.yml'
      - 'collector/benchmark_*.py'
      - 'scripts/run_stt_benchmark.sh'
      - 'tests/test_benchmark_asr.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run offline benchmark tests
        run: python -m unittest discover -s tests -p 'test_benchmark_asr.py' -v
      - name: Check local launcher syntax
        run: bash -n scripts/run_stt_benchmark.sh
# Model downloads and inference are intentionally local, via run_limited.sh.
