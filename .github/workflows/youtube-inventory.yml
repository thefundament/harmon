name: One-time creator YouTube metadata expansion
on:
  push:
    paths:
      - '.github/workflows/youtube-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    # This branch-only bootstrap prevents a second crawl when the PR is merged.
    if: github.ref == 'refs/heads/feat/expand-youtube-historical-sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata extractor
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Snapshot creator-owned Videos, Live, Shorts and playlists
        run: python collector/youtube_snapshot.py --max-playlists 6
      - name: Commit only discovered metadata to this feature branch
        run: |
          git config user.name harmon-corpus-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add corpus/discovery/youtube_expanded.jsonl corpus/discovery/youtube_expansion_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store one-time creator YouTube metadata inventory [skip ci]'
            git push origin HEAD:feat/expand-youtube-historical-sources
          fi
      - name: Retain offline discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmon-creator-youtube-inventory
          path: |
            corpus/discovery/youtube_expanded.jsonl
            corpus/discovery/youtube_expansion_report.json
          retention-days: 3
          if-no-files-found: warn
