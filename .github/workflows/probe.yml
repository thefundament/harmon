name: Public video connectivity pilot
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Probe one publicly linked Twitch clip and captions
        run: python collector/collect.py
      - name: Upload limited text and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmon-probe
          path: output/
          retention-days: 1
          if-no-files-found: warn
