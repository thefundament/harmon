name: Public video transcription pilot (PyAV)
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install media and ASR tools
        run: |
          python -m pip install --disable-pip-version-check yt-dlp faster-whisper
      - name: Fetch and transcribe one short public clip
        run: python collector/collect.py
      - name: Upload transcript and diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmon-transcript-pilot
          path: |
            output/*.json
            output/*.txt
          retention-days: 1
          if-no-files-found: warn
