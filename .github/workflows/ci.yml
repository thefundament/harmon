name: Corpus quality checks
on:
  push:
    paths:
      - 'collector/quality_gate.py'
      - 'collector/history_plan.py'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - 'corpus/unreviewed/**'
      - 'corpus/local_transcripts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harmon-quality
  cancel-in-progress: false
jobs:
  test-and-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild heuristic review queue
        run: python collector/quality_gate.py
      - name: Rebuild finite historical source worklist
        run: python collector/history_plan.py
      - name: Commit metadata-only quality index
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name harmon-corpus-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add corpus/quality corpus/history
          if ! git diff --cached --quiet; then
            git commit -m 'Update transcript review priorities [skip ci]'
            git push origin HEAD:main
          fi
