name: Corpus quality checks
on:
  push:
    paths:
      - 'collector/quality_gate.py'
      - 'collector/publish_indexes.py'
      - 'collector/local_worker.py'
      - 'scripts/bootstrap_linux.sh'
      - 'scripts/run_archive.sh'
      - 'scripts/run_limited.sh'
      - 'collector/memory_guard.py'
      - 'collector/history_plan.py'
      - 'collector/youtube_snapshot.py'
      - 'collector/combined_index.py'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - 'corpus/discovery/youtube_expanded.jsonl'
      - 'corpus/discovery/youtube.jsonl'
      - 'corpus/unreviewed/**'
      - 'corpus/local_transcripts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harmon-quality
  cancel-in-progress: false
jobs:
  test-and-index:
    runs-on: ubuntu-24.04
    # Metadata-only rebuild; large historical inventories are still lightweight.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate derived indexes on non-main branches
        if: github.ref != 'refs/heads/main'
        run: |
          python collector/quality_gate.py
          python collector/history_plan.py
          python collector/combined_index.py
      - name: Publish derived indexes from latest main with retry
        if: github.ref == 'refs/heads/main'
        run: python collector/publish_indexes.py
